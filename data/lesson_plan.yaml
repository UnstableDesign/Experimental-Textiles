# Experimental Textiles — Lesson Plan Schedule
# Edit this file each year. The lesson-plan page renders it automatically.
#
# File: data/lesson_plan.yaml  →  available in templates as .Site.Data.lesson_plan
#
# Schema
# ------
# default_bring: items students bring every day (unless a class sets bring_override)
#
# weeks: each week is Tuesday → Thursday
#   - number: week number (omit for breaks)
#     title: short week title
#     description: week goals (markdown ok)
#     break: true              # optional — break banner, no class grid
#     tuesday:                 # omit or null if no Tuesday meeting (e.g. semester starts Thu)
#     thursday:                # omit or null if no Thursday meeting
#       date: "M/D"
#       topic: session title
#       note: ""               # optional special note for the day (markdown ok)
#       no_class: true         # holiday / reading day / instructor out
#       active: []             # work in progress (not due today)
#       due: []                # due today (markdown links ok)
#       bring: []              # extras beyond default_bring
#       bring_override: []     # replace default_bring entirely; use [] for none
#       in_class: []           # activities (markdown links ok)

year: 2026
term: Fall

default_bring:
  - Your class kit

weeks:
  - number: 1
    title: Welcome
    description: >
      This week we're introducing the class and basics about weaving.
      *(Semester starts Thursday — no Tuesday meeting this week.)*
    thursday:
      date: "8/20"
      topic: Class Introduction
      note: First day of the semester — class meets Thursday only this week.
      active:
      due: []
      bring: []
      bring_override: []
      in_class:
        - Setting Community Norms
        - Questions about How Class Will Take Place
        - "[Paper Weaving](/pdf/PaperLoom.pdf)"
        - "Review [Required Supplies](../material-list)"

  - number: 2
    title: Weaving and Materials-Led Design
    description: >
      This week we're starting our first experiments with weaving alongside and introduction to materials-led design methodologies.
    tuesday:
      date: "8/25"
      topic: Design Philosophy
      # bring_override: []
      in_class:
         - Discussion of Sampling and Materials-Led Design
         - "Review [Weeklies Templates](../templates/weeklies-template)"
         - Assemble Class Kit
         - History Of Presentations
    thursday:
      date: "8/27"
      topic: Looms and Weaving
      bring: [a not-too-precious hard cover book of your choice]
      # active:
      due:
         - 'Annie Albers, On Weaving, "The Loom", pp 23-43 and images on pp 83-89'
      in_class:
      #   - Reading Discussion
      #   - History of Weaving and Weaving Machines
      #   - How to Take Good Photos
      #   - start [Weekly 1 — Make a Book Loom](../weeklies/1-make-a-book-loom)

  - number: 3
    title: Finishing and Connecting
    description: >
      we'll finish our book looms and start making connectors to use in soft circuits.
    tuesday:
      date: "9/1"
      topic: Finishing Techniques
      active: []
      due:
        - "[Weekly 1 — Make a Book Loom](../weeklies/1-make-a-book-loom)"
    bring: [your completed book loom]
    in_class:
      - book loom share out
      - finishing techniques (gluing/tying off, weaving in ends, etc.)
      - methods for making/customizing conductive yarns (plying, braiding, etc.)
 
    thursday:
      date: "9/3"
      topic: Conductive Yarns, Multi-meters, and Connectors
      # active:
      # due: []
      # bring: []
      in_class:
        - How to use a Multimeter
        - Understanding Resistance Worksheet
        - Start [Weekly 2 — Make Connectors](../weeklies/2-make-connectors)

  - number: 4
    title: Warping and Weaving with Etta Sandry
    description: > 
      we'll start warping and weaving on our Cricket looms and exploring different methods for integrating conductive materials.
    tuesday:
      date: "9/8"
      note: This class will be guest taught by Etta Sandry
      topic: Warping and Weaving Tabby
      # active: []
      due:
        - "[Weekly 2 — Make Connectors](../weeklies/2-make-connectors)"
      bring: [
        - your completed connectors
        - your cricket loom]
      in_class:
        - Connector Share Out
        - "[Parts of the Loom Quiz](../worksheets/parts-of-the-loom)"
        - Start [Weekly 3 — Warp and Weave](../weeklies/3-warp-and-weave)
      
    thursday:
      date: "9/10"
      topic: Manipulating Tabby 
      note: This class will be guest taught by Etta Sandry

      active:
         - "[Weekly 3 — Warp and Weave](../weeklies/3-warp-and-weave)"
      # due: []
      bring: [your cricket loom]
      in_class:
        - Tapestry Techniques (weft pile, looping, etc.)
        - Leno and Lace Structures

  - number: 5
    title: Tabby Play
    
    description: >
      We study variations on the tabby structure and supplemental weft techniques, which are especially
      useful for integrating conductive materials.
    tuesday:
      date: "9/15"
      no_class: true
      bring_override: []
    thursday:
      date: "9/17"
      note: This class will be guest taught by Steven Frost
      topic: Supplemental Wefts
      # active: []
      due:
        - "[Weekly 3 — Warp and Weave](../weeklies/3-warp-and-weave)"
      bring: [
        - your cricket loom
        - your swatches]
      in_class:
        - Share Out
        - Supplemental Weft Experimentation

  - number: 6
    title: Integrating Electronics
    description: >
      Apply the information we've learned earlier (largely supplemental wefts, etc) to integrate an electrical component into a cloth structure. We'll also start planning for your final projects. 
    tuesday:
